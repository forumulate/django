[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forumulate-django"
version = "0.1.0"
description = "Forumulate comments, docs search and changelog for Django templates, plus cached server-side content helpers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["Django>=3.2"]
classifiers = [
  "Framework :: Django",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
markdown = ["Markdown>=3.4"]

[project.urls]
Homepage = "https://forumulate.com/guides"
Source = "https://github.com/forumulate/django"

[tool.setuptools.packages.find]
include = ["forumulate_django*"]
